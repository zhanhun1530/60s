name: Deploy 60s to Cloudflare Worker
# 触发条件：main分支推送代码自动部署；同时支持网页手动一键部署
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库全部源码
      - name: Checkout code
        uses: actions/checkout@v4

      # 安装Node环境，运行wrangler
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 全局安装wrangler官方部署工具
      - name: Install Wrangler
        run: npm install -g wrangler

      # 执行部署命令，密钥自动读取仓库Secrets
      - name: Deploy to Cloudflare Workers
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: wrangler deploy
